name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve version from pushed tag
        id: version
        run: |
          if ! echo "${GITHUB_REF_NAME}" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Error: Invalid tag format. Use stable semantic version tags like v0.0.6"
            exit 1
          fi

          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Fetch origin/main
        run: |
          git fetch --no-tags origin main

      - name: Verify tag is annotated
        run: |
          tag_type=$(git for-each-ref --format='%(objecttype)' "refs/tags/${GITHUB_REF_NAME}")

          if [[ "$tag_type" != "tag" ]]; then
            echo "Error: ${GITHUB_REF_NAME} must be an annotated tag"
            exit 1
          fi

      - name: Verify tagged commit is on origin/main
        run: |
          tag_commit=$(git rev-list -n 1 "${GITHUB_REF_NAME}")

          if ! git merge-base --is-ancestor "$tag_commit" "origin/main"; then
            echo "Error: ${GITHUB_REF_NAME} does not point to a commit reachable from origin/main"
            exit 1
          fi

      - name: Fail if release already exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Error: GitHub release ${GITHUB_REF_NAME} already exists"
            exit 1
          fi

      - name: Extract release notes
        id: release_notes
        run: |
          version="${{ steps.version.outputs.version }}"

          if ! grep -q "^## \[$version\]" CHANGELOG.md; then
            echo "Error: CHANGELOG.md does not contain a section for $version"
            exit 1
          fi

          awk -v version="$version" '
            $0 ~ "^## \\[" version "\\]" { found=1; next }
            /^## \[/ { if (found) exit }
            found { print }
          ' CHANGELOG.md > release_notes.md

          if [[ ! -s release_notes.md ]]; then
            echo "Error: No release notes found for $version"
            exit 1
          fi

          echo "Release notes:"
          python3 - <<'PY'
          from pathlib import Path

          notes = Path("release_notes.md").read_text().strip()
          Path("release_notes.md").write_text(notes + "\n")
          print(notes)
          PY

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file release_notes.md \
            --verify-tag
