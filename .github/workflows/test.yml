# GitHub Actions workflow for git-local-override
#
# Runs tests on every push and pull request:
# - Unit tests
# - Integration tests (install, git operations, pre-commit)
# - Bash 3.2 compatibility tests (for macOS)
#
name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # Main test suite - runs all tests in Docker
  test:
    name: All Tests (Ubuntu)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Build Docker image
        run: make docker-build

      - name: Run all tests
        run: make test-docker

  # Bash 3.2 compatibility tests
  test-bash3:
    name: Bash 3.2 Compatibility
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Build bash 3.2 Docker image
        run: make docker-build-bash3

      - name: Run compatibility tests
        run: make test-docker-bash3

  # Native macOS tests (verifies actual macOS behavior)
  test-macos:
    name: Native macOS
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Pin bash to /bin/bash (3.2) and assert
        run: |
          mkdir -p "$RUNNER_TEMP/bash3bin"
          ln -s /bin/bash "$RUNNER_TEMP/bash3bin/bash"
          echo "$RUNNER_TEMP/bash3bin" >> "$GITHUB_PATH"
          /bin/bash -c 'echo "Pinned bash: $BASH_VERSION"'
          /bin/bash -c '[[ "${BASH_VERSINFO[0]}" -eq 3 ]]'

      - name: Run unit tests
        run: make test

      - name: Install pre-commit and fd
        run: brew install pre-commit fd

      - name: Run integration tests
        run: |
          chmod +x tests/integration/*.sh
          tests/integration/test-install.sh
          tests/integration/test-git-ops.sh
          tests/integration/test-precommit.sh
          tests/integration/test-worktrees.sh

  # Shellcheck linting
  lint:
    name: Shellcheck Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Run shellcheck
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        with:
          scandir: './bin ./hooks ./scripts ./shared ./tests'
          severity: warning

      - name: Check no resolver mirror exists under hooks/
        run: test ! -f hooks/local-override-resolver.sh

      - name: Check docs are in sync (version pins + CLI command coverage)
        run: make check-docs-sync
